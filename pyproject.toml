[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "obliviousmic-official-modules"
version = "1.1.1"
description = "Optional official ObliviousMic modules; weights and user assets excluded"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = ["numpy>=2,<3", "onnx>=1.16,<2", "onnxruntime>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["modules*"]

[tool.setuptools.package-data]
"modules.campplus" = ["*.json", "LICENSE", "NOTICE", "README.md"]
"modules.bsrnn" = ["*.json", "LICENSE", "NOTICE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/excerpt.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["modules", "tools", "tests"]
known-third-party = ["obliviousmic"]
