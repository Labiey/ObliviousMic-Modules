name: Validate maintained module sources
on:
  push:
    branches: [main]
    tags: ['campplus-v*', 'bsrnn-v*', 'asr-v*', 'asr_api-v*', 'tts-v*', 'subtitles-v*', 'broadcast-v*', 'translate-v*', 'denoise-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install "jsonschema>=4.23,<5"
      - run: python -m tools.validate_catalog --metadata-only
        # This existing CI validates metadata only; release publication is manual.
